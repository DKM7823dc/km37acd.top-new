<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC 泄露检测 · AB页规则测试</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f6f8fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            max-width: 760px;
            width: 100%;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.12);
            padding: 32px 28px;
            transition: all 0.2s;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #0b1a33;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #6b7a8f;
            margin-left: auto;
        }
        .sub {
            color: #5e6f88;
            font-size: 15px;
            border-bottom: 1px solid #e9edf4;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .ip-box {
            background: #f0f4fe;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 12px;
        }
        .ip-box .label {
            font-weight: 500;
            color: #1a2b44;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ip-box .value {
            font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
            font-size: 16px;
            background: #fff;
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid #dce3ef;
            color: #0b1a33;
            word-break: break-all;
        }
        .ip-box .badge {
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 40px;
            background: #d4e0f0;
            color: #1f3a5f;
        }
        .compare-result {
            background: #f7fafd;
            border-radius: 16px;
            padding: 18px 20px;
            margin: 18px 0 22px 0;
            border-left: 5px solid #3b7cff;
        }
        .compare-result .title {
            font-weight: 600;
            font-size: 16px;
            color: #0b1a33;
        }
        .compare-result .detail {
            margin-top: 6px;
            font-size: 15px;
            color: #1f3a5f;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 18px;
        }
        .compare-result .detail span {
            background: #eef3fa;
            padding: 2px 12px;
            border-radius: 20px;
        }
        .api-section {
            margin-top: 20px;
            background: #f9faff;
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid #e2e8f0;
        }
        .api-section .row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 14px;
            border-bottom: 1px dashed #e6ecf5;
        }
        .api-section .row:last-child {
            border-bottom: none;
        }
        .api-section .key {
            color: #42526b;
        }
        .api-section .val {
            font-weight: 500;
            color: #0b1a33;
            text-align: right;
        }
        .verdict {
            margin-top: 24px;
            padding: 20px 24px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            background: #eef3fa;
            color: #1f3a5f;
        }
        .verdict .action {
            font-size: 22px;
            margin-top: 4px;
        }
        .verdict .action.green {
            color: #1f8b4c;
        }
        .verdict .action.red {
            color: #c72a2a;
        }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        .btn-refresh {
            margin-top: 18px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            padding: 8px 24px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            color: #1a2b44;
        }
        .btn-refresh:hover {
            background: #f0f4fe;
            border-color: #3b7cff;
        }
        footer {
            margin-top: 18px;
            font-size: 12px;
            color: #8a9bb0;
            text-align: center;
            border-top: 1px solid #e9edf4;
            padding-top: 18px;
        }
        .ip-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
        }
        .ip-list .item {
            background: #eef3fa;
            padding: 2px 12px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 14px;
        }
        @media (max-width: 480px) {
            .card { padding: 20px; }
            .ip-box { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="card" id="app">
        <h1>
            🔍 WebRTC 泄露检测
            <small>AB页规则测试</small>
        </h1>
        <div class="sub">规则：若本地IP与公网IP不一致（且泄露公网IP），或公网IP为机房/VPN/代理，则判定为“审核/爬虫” → 留在A页</div>

        <!-- 公网IP -->
        <div class="ip-box">
            <span class="label">🌐 公网IP</span>
            <span class="value" id="publicIp">-</span>
            <span class="badge" id="publicIpType">检测中...</span>
        </div>

        <!-- WebRTC 本地IP -->
        <div class="ip-box">
            <span class="label">📡 WebRTC 本地IP</span>
            <div class="ip-list" id="localIpList">
                <span class="item">获取中...</span>
            </div>
            <span class="badge" id="localCount">0</span>
        </div>

        <!-- 对比结果 -->
        <div class="compare-result" id="compareResult">
            <div class="title">⚖️ 一致性对比</div>
            <div class="detail" id="compareDetail">
                <span>等待检测...</span>
            </div>
        </div>

        <!-- 公网IP 详细信息 (来自 ipapi.is，带降级) -->
        <div class="api-section" id="ipapiSection">
            <div style="font-weight:600; margin-bottom:8px;">📊 公网IP 威胁情报 (ipapi.is)</div>
            <div id="ipapiContent">
                <div class="row"><span class="key">状态</span><span class="val" id="ipapiStatus">加载中...</span></div>
                <div class="row"><span class="key">国家</span><span class="val" id="ipapiCountry">-</span></div>
                <div class="row"><span class="key">运营商 (ISP)</span><span class="val" id="ipapiIsp">-</span></div>
                <div class="row"><span class="key">数据中心</span><span class="val" id="ipapiDatacenter">-</span></div>
                <div class="row"><span class="key">VPN / 代理</span><span class="val" id="ipapiVpn">-</span></div>
                <div class="row"><span class="key">Tor / 爬虫</span><span class="val" id="ipapiTor">-</span></div>
            </div>
        </div>

        <!-- 最终裁决 -->
        <div class="verdict" id="verdict">
            <div>🧾 推荐动作</div>
            <div class="action" id="actionDisplay">⏳ 分析中...</div>
        </div>

        <button class="btn-refresh" id="refreshBtn">⟳ 重新检测</button>
        <footer>本页面仅用于演示，所有API调用均为前端直接请求。WebRTC 需要允许浏览器使用。</footer>
    </div>

    <script>
        (function() {
            'use strict';

            // DOM 元素
            const publicIpEl = document.getElementById('publicIp');
            const publicIpTypeEl = document.getElementById('publicIpType');
            const localIpListEl = document.getElementById('localIpList');
            const localCountEl = document.getElementById('localCount');
            const compareDetailEl = document.getElementById('compareDetail');
            const ipapiStatus = document.getElementById('ipapiStatus');
            const ipapiCountry = document.getElementById('ipapiCountry');
            const ipapiIsp = document.getElementById('ipapiIsp');
            const ipapiDatacenter = document.getElementById('ipapiDatacenter');
            const ipapiVpn = document.getElementById('ipapiVpn');
            const ipapiTor = document.getElementById('ipapiTor');
            const actionDisplay = document.getElementById('actionDisplay');
            const refreshBtn = document.getElementById('refreshBtn');

            // ----- 更新后的公网IP获取（多备用接口） -----
            async function fetchPublicIP() {
                const providers = [
                    // 1. ipify（国际通用，稳定）
                    { url: 'https://api.ipify.org?format=json', parser: d => d.ip, timeout: 5000 },
                    // 2. ip-api.com（免费，支持CORS，国内访问良好）
                    { url: 'https://ip-api.com/json/', parser: d => d.query, timeout: 5000 },
                    // 3. ipwho.is（国际备用，JSON格式）
                    { url: 'https://ipwho.is/', parser: d => d.ip, timeout: 5000 },
                    // 4. myip.top（国内节点，速度极快）
                    { url: 'https://myip.top/json', parser: d => d.ip, timeout: 5000 }
                ];

                for (let p of providers) {
                    try {
                        const controller = new AbortController();
                        const timer = setTimeout(() => controller.abort(), p.timeout);
                        
                        const res = await fetch(p.url, { 
                            signal: controller.signal,
                            headers: { 'Accept': 'application/json' }
                        });
                        clearTimeout(timer);
                        
                        if (!res.ok) continue;
                        const data = await res.json();
                        const ip = p.parser(data);
                        if (ip && ip !== '0.0.0.0' && !ip.startsWith('127.')) {
                            console.log(`✅ 通过 ${p.url} 获取到IP: ${ip}`);
                            return ip;
                        }
                    } catch (e) {
                        console.warn(`⏳ 备用接口 ${p.url} 失败:`, e.message);
                        // 继续尝试下一个
                    }
                }
                throw new Error('所有IP获取接口均不可用，请检查网络连接');
            }

            // ----- 容错机制 2: 带降级的 ipapi.is 查询 (国内无法访问则跳过) -----
            async function fetchIpapi(ip) {
                try {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 5000); // 5秒超时
                    
                    const res = await fetch(`https://api.ipapi.is/?q=${encodeURIComponent(ip)}`, {
                        signal: controller.signal
                    });
                    clearTimeout(timer);
                    if (!res.ok) throw new Error('HTTP Error');
                    return await res.json();
                } catch (e) {
                    console.warn('⚠️ ipapi.is 查询失败（可能被墙），降级忽略此情报', e.message);
                    return null; // 降级返回 null，不影响主流程
                }
            }

            // ----- WebRTC 获取本地IP (不变) -----
            function getWebRTCIPs() {
                return new Promise((resolve) => {
                    const ips = [];
                    const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                    pc.createDataChannel('');
                    pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => {});
                    
                    pc.onicecandidate = (event) => {
                        if (!event || !event.candidate) {
                            pc.close();
                            const ipv4Set = new Set();
                            ips.forEach(ip => {
                                if (ip && ip !== '0.0.0.0' && ip !== '::' && ip !== '::1') {
                                    ipv4Set.add(ip);
                                }
                            });
                            resolve([...ipv4Set]);
                            return;
                        }
                        const candidate = event.candidate.candidate;
                        if (!candidate) return;
                        const ipRegex = /([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})|([a-fA-F0-9:]+)/g;
                        const match = candidate.match(ipRegex);
                        if (match) {
                            match.forEach(ip => {
                                if (ip && !ips.includes(ip)) ips.push(ip);
                            });
                        }
                    };
                    setTimeout(() => {
                        pc.close();
                        if (ips.length === 0) ips.push('无法获取');
                        resolve(ips);
                    }, 3000);
                });
            }

            function isPrivateIP(ip) {
                const parts = ip.split('.');
                if (parts.length === 4) {
                    const first = parseInt(parts[0]);
                    if (first === 10) return true;
                    if (first === 172 && parseInt(parts[1]) >= 16 && parseInt(parts[1]) <= 31) return true;
                    if (first === 192 && parseInt(parts[1]) === 168) return true;
                }
                return false;
            }

            // ----- 主流程 -----
            async function runDetection() {
                document.getElementById('app').classList.add('loading');
                // 重置显示
                publicIpEl.textContent = '获取中...';
                publicIpTypeEl.textContent = '检测中...';
                ipapiStatus.textContent = '⏳ 连接中...';
                
                try {
                    // 1. 获取公网IP (带容错重试)
                    const publicIP = await fetchPublicIP();
                    publicIpEl.textContent = publicIP;
                    publicIpTypeEl.textContent = '✅ 已获取';

                    // 2. WebRTC本地IP
                    const localIPs = await getWebRTCIPs();
                    if (localIPs.length === 0 || localIPs[0] === '无法获取') {
                        localIpListEl.innerHTML = '<span class="item">未检测到</span>';
                        localCountEl.textContent = '0';
                    } else {
                        localIpListEl.innerHTML = localIPs.map(ip => `<span class="item">${ip}</span>`).join('');
                        localCountEl.textContent = localIPs.length;
                    }

                    // 3. 对比逻辑 (WebRTC检测)
                    let match = localIPs.some(ip => ip === publicIP);
                    let compareText = '';
                    let compareRisk = 'safe';
                    const hasPublicLocal = localIPs.some(ip => !isPrivateIP(ip) && ip !== '127.0.0.1' && ip !== '::1');

                    if (match) {
                        compareText = '✅ 公网IP与WebRTC本地IP一致（直连）';
                        compareRisk = 'safe';
                    } else {
                        if (hasPublicLocal) {
                            compareText = '⚠️ 公网IP与本地IP不同，且本地包含公网IP，疑似代理/VPN';
                            compareRisk = 'danger';
                        } else {
                            compareText = 'ℹ️ 公网IP与本地IP不同（本地仅私有IP），正常NAT环境';
                            compareRisk = 'warn';
                        }
                    }
                    compareDetailEl.innerHTML = `<span>${compareText}</span>`;

                    // 4. 查询 ipapi.is (带降级，不通则跳过)
                    let shouldRedirect = true;
                    let reasons = [];

                    // WebRTC 判定（如果本地有公网IP且不匹配，直接拉黑）
                    if (!match && hasPublicLocal) {
                        shouldRedirect = false;
                        reasons.push('WebRTC泄露公网IP与出口IP不一致（代理特征）');
                    }

                    // 尝试获取情报（如果被墙，ipapiData 为 null，不影响跳转，只依赖WebRTC）
                    const ipapiData = await fetchIpapi(publicIP);
                    if (ipapiData) {
                        ipapiStatus.textContent = '✅ 成功';
                        ipapiCountry.textContent = ipapiData.country_code || '-';
                        ipapiIsp.textContent = ipapiData.isp || '-';
                        ipapiDatacenter.textContent = ipapiData.is_datacenter ? '🔴 是' : '✅ 否';
                        ipapiVpn.textContent = (ipapiData.is_vpn || ipapiData.is_proxy) ? '🔴 是' : '✅ 否';
                        ipapiTor.textContent = (ipapiData.is_tor || ipapiData.is_crawler) ? '🔴 是' : '✅ 否';

                        // 补充情报逻辑
                        if (ipapiData.is_datacenter) { shouldRedirect = false; reasons.push('公网IP位于数据中心'); }
                        if (ipapiData.is_vpn || ipapiData.is_proxy) { shouldRedirect = false; reasons.push('公网IP为VPN/代理'); }
                        if (ipapiData.is_tor || ipapiData.is_crawler) { shouldRedirect = false; reasons.push('公网IP为Tor/爬虫'); }
                    } else {
                        ipapiStatus.textContent = '⏭️ 降级跳过 (网络限制)';
                        ipapiCountry.textContent = '未获取';
                        ipapiIsp.textContent = '未获取';
                        ipapiDatacenter.textContent = '⏭️ 跳过';
                        ipapiVpn.textContent = '⏭️ 跳过';
                        ipapiTor.textContent = '⏭️ 跳过';
                    }

                    // 最终裁决
                    const actionEl = document.getElementById('actionDisplay');
                    const verdictEl = document.getElementById('verdict');
                    if (shouldRedirect) {
                        actionEl.innerHTML = '✅ 跳转到 <strong>B页</strong>（真实用户）';
                        actionEl.className = 'action green';
                        verdictEl.style.background = '#e6f7e6';
                    } else {
                        actionEl.innerHTML = '⛔ 停留在 <strong>A页</strong>（审核/爬虫）';
                        actionEl.className = 'action red';
                        verdictEl.style.background = '#fde8e8';
                        if (reasons.length) {
                            actionEl.innerHTML += `<div style="font-size:14px;font-weight:400;margin-top:8px;color:#5e4f4f;">原因：${reasons.join('；')}</div>`;
                        }
                    }

                } catch (error) {
                    console.error('检测失败', error);
                    document.getElementById('compareDetail').innerHTML = `<span>❌ 检测失败: ${error.message}</span>`;
                    document.getElementById('actionDisplay').textContent = '⚠️ 请检查网络或刷新重试';
                    publicIpEl.textContent = '获取失败';
                } finally {
                    document.getElementById('app').classList.remove('loading');
                }
            }

            refreshBtn.addEventListener('click', runDetection);
            runDetection();
        })();
    </script>

</body>
